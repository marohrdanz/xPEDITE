server {

  access_log /logs/access.log main;
  error_log /logs/error.log warn;
  listen 80;
  listen [::]:80 default_server;
  listen 443 ssl http2 default_server;
  listen [::]:443 ssl http2 default_server;
  ssl_certificate /etc/ssl/certs/cert.pem;
  ssl_certificate_key /etc/ssl/certs/key.pem;
  ssl_protocols   TLSv1.2;
  server_name  localhost;
  absolute_redirect off;
  # Allow some headroom above the 5MB file limit advertised to users, since
  # multipart/form-data requests include other form fields and boundary
  # overhead on top of the file itself.
  client_max_body_size 6M;

  location / {
    proxy_pass http://backend:3000/;
    proxy_set_header Host $http_host;
    proxy_intercept_errors on;
    error_page 401 = @error401;
    error_page 413 = @error413;
    # error_page 400 = @error400;
  }

  location @error413 {
    default_type text/plain;
    return 413 'The file you are trying to upload is too large. Maximum allowed size is 5MB.';
  }

  include /etc/nginx/snippets/ldap-jwt.conf;

}
